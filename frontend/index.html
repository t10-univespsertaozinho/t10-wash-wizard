    <!-- Script bloqueante do next-themes: aplica a classe de tema em <html> antes do
         primeiro paint, evitando o "flash" de tema errado ao carregar a página. -->
    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem('theme') || 'system';
          var resolvedTheme = storedTheme === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : storedTheme;
          document.documentElement.classList.add(resolvedTheme);
          document.documentElement.style.colorScheme = resolvedTheme;
        } catch (e) {
          /* localStorage bloqueado (modo privado): segue o padrão do CSS */
        }
      })();
    </script>
