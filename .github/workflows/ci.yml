name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes com cobertura (vitest)
        # O job falha se a cobertura cair abaixo dos limiares de
        # frontend/vitest.config.ts — global e por diretório (FA-19).
        run: npm run test:coverage

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage
          retention-days: 7
          if-no-files-found: ignore

      - name: Build de produção
        run: npm run build

  backend:
    name: Backend (testes + boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # PostgreSQL descartável para os testes de integração e para o boot.
    # A suíte apaga os dados do banco: nunca aponte TEST_DATABASE_URL para
    # produção (helpers.js recusa hosts Supabase de propósito).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wash_wizard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Bancos distintos: os testes apagam tudo, o boot usa o banco "de dev".
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wash_wizard
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wash_wizard_test
      PGSSLMODE: disable
      JWT_SECRET: segredo_de_ci_com_mais_de_32_caracteres_000000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Audit de dependências
        run: npm audit --audit-level=high

      - name: Criar banco de testes
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE wash_wizard_test'

      - name: Aplicar schema e migrations
        # `db:schema` é idempotente (CREATE ... IF NOT EXISTS) e `db:migrate`
        # aplica a compatibilidade da trilha de auditoria.
        run: |
          npm run db:schema
          npm run db:migrate

      - name: Testes de integração (vitest + supertest)
        # Sobe o app Express real contra o PostgreSQL descartável e cobre as
        # regressões de segurança da auditoria: RBAC das rotas destrutivas,
        # posse de data_conclusao, trilha de auditoria e validação do CSV.
        run: npm test

      - name: Config de produção sem variáveis de seed
        # Regressão do deploy no Render: importar a configuração da API não pode
        # exigir SEED_ADMIN_PASSWORD/SEED_OPERADOR_PASSWORD, que só o seed usa.
        env:
          NODE_ENV: production
        run: |
          SEED_ADMIN_PASSWORD= SEED_OPERADOR_PASSWORD= node -e "import('./config.js').then(() => console.log('CONFIG_OK')).catch(e => { console.error(e); process.exit(1); })"

      - name: Subir o servidor em produção e validar boot (sem seed)
        # Reproduz o ambiente do Render: NODE_ENV=production e nenhuma variável
        # de seed definida. Um 401 no login prova que a API subiu.
        env:
          NODE_ENV: production
          FRONTEND_URL: https://frontend.example.com
          SEED_ADMIN_PASSWORD: ''
          SEED_OPERADOR_PASSWORD: ''
        run: |
          node server.js > /tmp/boot.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 15); do
            CODE=$(
              curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:3001/api/auth/login \
                -H 'Content-Type: application/json' -d '{"email":"x","senha":"y"}' || true
            )
            if [ "$CODE" != "000" ]; then break; fi
            sleep 1
          done
          # 401 com credenciais inválidas prova que o Express está de pé
          # (o acesso à rota só ocorre após o schema ser aplicado via dbReady).
          echo "HTTP /api/auth/login = $CODE (esperado: 401)"
          test "$CODE" = "401" || { kill $SERVER_PID 2>/dev/null || true; cat /tmp/boot.log; exit 1; }
          kill $SERVER_PID 2>/dev/null || true
          cat /tmp/boot.log
          grep -q "Backend PostgreSQL rodando" /tmp/boot.log
