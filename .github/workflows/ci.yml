name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes (vitest)
        run: npm run test

      - name: Build de produção
        run: npm run build

  backend:
    name: Backend (boot + healthcheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Audit de dependências
        run: npm audit --audit-level=high

      - name: Subir o servidor e validar boot
        run: |
          node server.js > /tmp/boot.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 15); do
            CODE=$(
              curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:3001/api/auth/login \
                -H 'Content-Type: application/json' -d '{"email":"x","senha":"y"}' || true
            )
            if [ "$CODE" != "000" ]; then break; fi
            sleep 1
          done
          # 401 com credenciais inválidas prova que o Express está de pé
          # (o acesso à rota só ocorre após o schema ser aplicado via dbReady).
          echo "HTTP /api/auth/login = $CODE (esperado: 401)"
          test "$CODE" = "401" || { kill $SERVER_PID 2>/dev/null || true; cat /tmp/boot.log; exit 1; }
          kill $SERVER_PID 2>/dev/null || true
          cat /tmp/boot.log
          grep -q "Backend SQLite rodando" /tmp/boot.log